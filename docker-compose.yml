# Single host: the API and the worker share the data volume (SQLite + media).
# Put an HTTPS reverse proxy (Caddy, nginx, Cloudflare Tunnel) in front of port 8000.

x-app: &app
  build: .
  image: kassa-control
  env_file: .env
  volumes:
    - ./data:/data
    - ./models:/models:ro
    - ./rules:/app/rules:ro
  restart: unless-stopped

services:
  api:
    <<: *app
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    # Let the current job finish on `docker compose stop`.
    stop_grace_period: 5m
