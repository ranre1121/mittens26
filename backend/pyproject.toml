[project]
name = "kassa-control"
version = "0.1.0"
description = "Cashier video analysis service: FastAPI API, analysis worker and local pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "av>=12",
    "pillow>=10",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
yolo = ["ultralytics==8.3.227"]
# GPU machine only: the resident Qwen daemon (qwen_runner). torch comes from
# the CUDA wheel index, see scripts/brev-analyzer.sh.
qwen = ["transformers==4.57.6", "accelerate==1.12.0", "safetensors", "peft==0.17.1", "bitsandbytes==0.48.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "qwen_runner*"]

[tool.setuptools.package-data]
qwen_runner = ["prompt-v2.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
